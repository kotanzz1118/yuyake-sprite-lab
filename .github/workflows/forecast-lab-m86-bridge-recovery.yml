          OUT_COLS=['Date','Open','High','Low','Close','Adj Close','Volume','Dividends','Stock Splits','security_code','source','adjustment_semantics']
          def extract(frame,ticker):
              if frame is None or len(frame)==0: return pd.DataFrame()
              if isinstance(frame.columns,pd.MultiIndex):
                  lv0=set(map(str,frame.columns.get_level_values(0)))
                  lv1=set(map(str,frame.columns.get_level_values(1)))
                  if ticker in lv0: s=frame[ticker].copy()
                  elif ticker in lv1: s=frame.xs(ticker,axis=1,level=1).copy()
                  else: return pd.DataFrame()
              else: s=frame.copy()
              s=s.reset_index()
              if 'Datetime' in s.columns and 'Date' not in s.columns: s=s.rename(columns={'Datetime':'Date'})
              if 'Date' not in s.columns or 'Close' not in s.columns: return pd.DataFrame()
              return s
          attempts=[]; frames=[]; done=set()
          groups={}
          for x in SPECS: groups.setdefault(x['fetch_end'],[]).append(x)
          for attempt,batch_size in [(1,20),(2,5)]:
              pending=[x for x in SPECS if x['code'] not in done]
              if not pending: break
              for fetch_end in sorted({x['fetch_end'] for x in pending}):
                  group=[x for x in pending if x['fetch_end']==fetch_end]
                  for i in range(0,len(group),batch_size):
                      batch=group[i:i+batch_size]; tickers=[x['code']+'.T' for x in batch]
