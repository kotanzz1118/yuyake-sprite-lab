                              z=z[(z['Date']>=pd.Timestamp(x['listing_date'])) & (z['Date']<pd.Timestamp(fetch_end))]
                              z=z[pd.to_numeric(z['Close'],errors='coerce').notna()].copy()
                          if len(z):
                              for c in ['Open','High','Low','Close','Adj Close','Volume','Dividends','Stock Splits']:
                                  if c not in z: z[c]=pd.NA
                              z['security_code']=x['code']; z['source']='YAHOO_YFINANCE_M86_EXISTING_ROUTE'
                              z['adjustment_semantics']='YAHOO_RAW_OHLC_SPLIT_ADJUSTED_DIVIDENDS_EXCLUDED__NO_JPX_FACTOR'
                              frames.append(z[OUT_COLS]); done.add(x['code'])
                              attempts.append({'security_code':x['code'],'attempt':attempt,'status':'SUCCESS','rows':len(z),'date_min':str(z.Date.min().date()),'date_max':str(z.Date.max().date()),'requested_start':x['listing_date'],'requested_end_exclusive':fetch_end,'error':None})
                          else:
