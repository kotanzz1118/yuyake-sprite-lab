                      time.sleep(0.7 if attempt==1 else 1.5)
          if frames:
              out=pd.concat(frames,ignore_index=True)
              out=out.sort_values(['security_code','Date']).drop_duplicates(['security_code','Date'],keep='last')
          else: out=pd.DataFrame(columns=OUT_COLS)
          out.to_csv('m86_remote_ipo_raw.csv.gz',index=False,compression='gzip')
          pd.DataFrame(attempts).to_csv('m86_acquisition_attempts.csv',index=False)
          failed=sorted({x['code'] for x in SPECS}-done)
          stats={'requested_codes':len(SPECS),'successful_codes':len(done),'failed_codes':len(failed),'raw_rows':int(len(out)),'failed_security_codes':failed,'attempts':len(attempts)}
          open('m86_acquisition_stats.json','w').write(json.dumps(stats,indent=2,sort_keys=True)+'\n')
