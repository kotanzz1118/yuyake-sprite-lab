name: Forecast Lab skills integration

on:
  push:
    branches: [forecast-lab-skills-integration-v1]
    paths:
      - 'forecast_lab_skills/**'
      - '.github/workflows/forecast-lab-skills-integration.yml'
  pull_request:
    paths:
      - 'forecast_lab_skills/**'
      - '.github/workflows/forecast-lab-skills-integration.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Forecast Lab skill safety tests
        run: |
          cd forecast_lab_skills
          python -m unittest discover -s tests -v
